name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm verify:security
      - run: pnpm verify:e2e
      - run: pnpm verify:ops
